<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LSBA Dashboard</title>
<style>
  :root{
    --ink:#1A1F1D; --ink-soft:#3E453F; --muted:#5B655F;
    --paper:#F0F2EC; --surface:#FFFFFF; --surface-2:#F7F8F4;
    --border:rgba(26,31,29,0.12); --border-strong:rgba(26,31,29,0.22);
    --accent:#4B4F9E; --accent-ink:#FFFFFF; --accent-soft:rgba(75,79,158,0.12); --accent-strong:#3A3E82;
    --good:#2E8F5B; --good-soft:rgba(46,143,91,0.14);
    --warn:#B8790F; --warn-soft:rgba(184,121,15,0.14);
    --crit:#C4453A; --crit-soft:rgba(196,69,58,0.14);
    --info:#1C7FB8; --info-soft:rgba(28,127,184,0.14);
    --cat-1:#4B4F9E; --cat-2:#1F8A6F; --cat-3:#C9762E; --cat-4:#B23B6E; --cat-5:#1C7FB8; --cat-6:#7A8B3C;
    --shadow:0 1px 2px rgba(20,24,20,0.05), 0 10px 30px -14px rgba(20,24,20,0.22);
    --radius:10px; --radius-sm:7px;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
    --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#E7E9E3; --ink-soft:#C7CCC3; --muted:#9AA39C;
      --paper:#14171A; --surface:#1B1F23; --surface-2:#20242A;
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
      --accent:#8285D6; --accent-ink:#12131F; --accent-soft:rgba(130,133,214,0.18); --accent-strong:#a3a5e3;
      --good:#3DA483; --good-soft:rgba(61,164,131,0.16);
      --warn:#C87527; --warn-soft:rgba(200,117,39,0.16);
      --crit:#DD6157; --crit-soft:rgba(221,97,87,0.16);
      --info:#3D96C4; --info-soft:rgba(61,150,196,0.16);
      --cat-1:#8285D6; --cat-2:#3DA483; --cat-3:#C87527; --cat-4:#C15D85; --cat-5:#3D96C4; --cat-6:#89974A;
      --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -14px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#E7E9E3; --ink-soft:#C7CCC3; --muted:#9AA39C;
    --paper:#14171A; --surface:#1B1F23; --surface-2:#20242A;
    --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.20);
    --accent:#8285D6; --accent-ink:#12131F; --accent-soft:rgba(130,133,214,0.18); --accent-strong:#a3a5e3;
    --good:#3DA483; --good-soft:rgba(61,164,131,0.16);
    --warn:#C87527; --warn-soft:rgba(200,117,39,0.16);
    --crit:#DD6157; --crit-soft:rgba(221,97,87,0.16);
    --info:#3D96C4; --info-soft:rgba(61,150,196,0.16);
    --cat-1:#8285D6; --cat-2:#3DA483; --cat-3:#C87527; --cat-4:#C15D85; --cat-5:#3D96C4; --cat-6:#89974A;
    --shadow:0 1px 2px rgba(0,0,0,0.35), 0 10px 30px -14px rgba(0,0,0,0.55);
  }
  :root[data-theme="light"]{
    --ink:#1A1F1D; --ink-soft:#3E453F; --muted:#5B655F;
    --paper:#F0F2EC; --surface:#FFFFFF; --surface-2:#F7F8F4;
    --border:rgba(26,31,29,0.12); --border-strong:rgba(26,31,29,0.22);
    --accent:#4B4F9E; --accent-ink:#FFFFFF; --accent-soft:rgba(75,79,158,0.12); --accent-strong:#3A3E82;
    --good:#2E8F5B; --good-soft:rgba(46,143,91,0.14);
    --warn:#B8790F; --warn-soft:rgba(184,121,15,0.14);
    --crit:#C4453A; --crit-soft:rgba(196,69,58,0.14);
    --info:#1C7FB8; --info-soft:rgba(28,127,184,0.14);
    --cat-1:#4B4F9E; --cat-2:#1F8A6F; --cat-3:#C9762E; --cat-4:#B23B6E; --cat-5:#1C7FB8; --cat-6:#7A8B3C;
    --shadow:0 1px 2px rgba(20,24,20,0.05), 0 10px 30px -14px rgba(20,24,20,0.22);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overflow-x:hidden;}
  body{
    font-family:var(--font-ui); color:var(--ink); background:var(--paper);
    font-size:13.5px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  a{color:inherit;}
  button{font-family:inherit;color:inherit;}
  input,select,textarea{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.01em;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  .mono{font-family:var(--font-mono);}

  #app{display:flex;min-height:100vh;}
  .hidden{display:none!important;}

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:216px; flex:0 0 216px; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:16px 12px; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar.collapsed{width:64px;flex-basis:64px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 14px;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;background:linear-gradient(155deg,var(--accent),var(--accent-strong));
    color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-weight:700;font-size:14px;flex:none;
  }
  .brand-text{font-family:var(--font-display);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;}
  .brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;}
  #sidebar.collapsed .brand-text,#sidebar.collapsed .brand-sub,#sidebar.collapsed .navlabel,#sidebar.collapsed .navsection{display:none;}

  .navsection{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 4px;}
  .navitem{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;
    color:var(--ink-soft);font-size:13px;font-weight:500;position:relative;
  }
  .navitem:hover{background:var(--surface-2);}
  .navitem.active{background:var(--accent-soft);color:var(--accent);}
  .navitem .ic{width:17px;height:17px;flex:none;}
  .navitem .badge{
    margin-left:auto;background:var(--crit);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;
  }
  .navcollapse{margin-top:auto;display:flex;justify-content:flex-end;padding:6px;}
  .iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);flex:none;}
  .iconbtn:hover{background:var(--surface-2);color:var(--ink);}
  .mobile-menu-btn{display:none;}
  .sidebar-backdrop{position:fixed;inset:0;background:rgba(10,12,10,0.45);z-index:80;}

  /* ---------- Topbar ---------- */
  #main{flex:1;min-width:0;display:flex;flex-direction:column;}
  #topbar{
    height:56px;flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;
    padding:0 20px;background:var(--paper);position:sticky;top:0;z-index:20;
  }
  .viewtitle{font-family:var(--font-display);font-size:18px;font-weight:700;white-space:nowrap;}
  .search-wrap{position:relative;flex:1;max-width:380px;min-width:120px;}
  .search-wrap input{
    width:100%;padding:7px 10px 7px 30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);font-size:12.5px;
  }
  .search-wrap input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .search-wrap .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);}
  .top-spacer{flex:1;}
  .btn{
    display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
    color:var(--ink);padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn.danger{color:var(--crit);}
  .btn.ghost{border-color:transparent;background:transparent;}
  .btn.ghost:hover{background:var(--surface-2);}
  .btn.sm{padding:4px 9px;font-size:11.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn .ic{width:14px;height:14px;}

  .iconbell{position:relative;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;}
  .iconbell:hover{background:var(--surface-2);}
  .iconbell .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:1.5px solid var(--surface);}
  .avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:none;}

  /* dropdown panel */
  .dropdown{position:absolute;top:48px;right:20px;width:340px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);z-index:60;overflow:hidden;}
  .dropdown-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:12.5px;}
  .dropdown-body{max-height:380px;overflow-y:auto;}
  .notif-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-item.unread{background:var(--accent-soft);}
  .notif-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-top:5px;}
  .notif-item.read .notif-dot{visibility:hidden;}
  .notif-text{font-size:12.3px;}
  .notif-time{font-size:11px;color:var(--muted);margin-top:2px;}

  /* ---------- View root ---------- */
  #view-root{padding:22px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
  .view-head p{color:var(--muted);margin:4px 0 0;font-size:13px;}
  .head-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ---------- Grid / cards ---------- */
  .grid{display:grid;gap:14px;}
  .grid-kpi{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1.3fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-charts{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1080px){.grid-kpi{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-charts{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;}}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
  .card-title{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .card-sub{font-size:11.5px;color:var(--muted);}

  .kpi-card{display:flex;flex-direction:column;gap:6px;}
  .kpi-top{display:flex;align-items:center;justify-content:space-between;}
  .kpi-value{font-family:var(--font-display);font-size:29px;font-weight:700;line-height:1;}
  .kpi-label{font-size:12px;color:var(--muted);font-weight:600;}
  .kpi-spark{margin-top:2px;}

  .chart-card .chart-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);}
  .legend-item{display:flex;align-items:center;gap:5px;}
  .legend-swatch{width:9px;height:9px;border-radius:2.5px;flex:none;}
  .chart-tooltip{
    position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);font-size:11.5px;padding:6px 9px;border-radius:7px;
    z-index:200;opacity:0;transform:translate(-50%,-115%);transition:opacity .08s;white-space:nowrap;box-shadow:var(--shadow);
  }
  @media (prefers-color-scheme:dark){.chart-tooltip{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}}
  :root[data-theme="dark"] .chart-tooltip{background:var(--surface-2);color:var(--ink);border:1px solid var(--border);}
  .chart-tooltip.show{opacity:1;}

  /* pills / chips */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill.status-Pending{background:var(--surface-2);color:var(--muted);}
  .pill.status-InProgress{background:var(--info-soft);color:var(--info);}
  .pill.status-Submitted{background:var(--warn-soft);color:var(--warn);}
  .pill.status-Approved{background:var(--good-soft);color:var(--good);}
  .pill.status-Rejected{background:var(--crit-soft);color:var(--crit);}
  .pill.status-Completed{background:var(--accent-soft);color:var(--accent);}
  .pill.pr-High{background:var(--crit-soft);color:var(--crit);}
  .pill.pr-Medium{background:var(--warn-soft);color:var(--warn);}
  .pill.pr-Low{background:var(--surface-2);color:var(--muted);}
  .pill.overdue{background:var(--crit-soft);color:var(--crit);}
  .tag{display:inline-flex;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-soft);font-size:11px;border:1px solid var(--border);}

  /* activity feed */
  .activity-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .activity-row:last-child{border-bottom:none;}
  .act-icon{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted);}
  .act-text{font-size:12.5px;}
  .act-time{font-size:11px;color:var(--muted);}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:12.6px;}
  th{text-align:left;font-size:10.8px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
  tr.taskrow{cursor:pointer;}
  tr.taskrow:hover{background:var(--surface-2);}
  .table-wrap{overflow-x:auto;}
  .checkbox{width:15px;height:15px;accent-color:var(--accent);}
  .titlecell{font-weight:600;}
  .titlecell .id{color:var(--muted);font-weight:400;font-family:var(--font-mono);font-size:10.8px;display:block;}
  .userchip{display:flex;align-items:center;gap:6px;}
  .userchip .avatar{width:20px;height:20px;font-size:9px;}

  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  select,.field-input{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:8px;padding:6.5px 9px;font-size:12.3px;}
  .bulkbar{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12.3px;color:var(--accent);flex-wrap:wrap;}

  /* Kanban */
  .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start;}
  @media (max-width:1100px){.kanban{grid-template-columns:1fr;}}
  .kcol{background:var(--surface-2);border-radius:var(--radius);padding:10px;min-height:120px;}
  .kcol-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-weight:700;font-size:12px;}
  .kcol-count{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted);}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:var(--shadow);}
  .kcard:active{cursor:grabbing;}
  .kcard.dragging{opacity:.4;}
  .kcard-title{font-size:12.3px;font-weight:600;margin-bottom:6px;}
  .kcard-meta{display:flex;align-items:center;justify-content:space-between;}
  .kcol.dragover{outline:2px dashed var(--accent);outline-offset:-4px;}

  /* Calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.8px;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:4px;font-weight:700;}
  .cal-cell{background:var(--surface);border:1px solid var(--border);border-radius:8px;min-height:96px;padding:6px;font-size:11px;}
  .cal-cell.other-month{opacity:.4;}
  .cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-daynum{font-weight:700;margin-bottom:4px;font-family:var(--font-mono);}
  .cal-chip{display:block;background:var(--surface-2);border-radius:5px;padding:2px 5px;margin-bottom:3px;font-size:10.5px;cursor:pointer;border-left:3px solid var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-chip.pr-High{border-color:var(--crit);}
  .cal-chip.pr-Medium{border-color:var(--warn);}
  .cal-chip.pr-Low{border-color:var(--info);}

  /* Modal / slideover */
  .overlay{position:fixed;inset:0;background:rgba(10,12,10,0.42);z-index:90;display:flex;justify-content:flex-end;}
  .overlay.center{align-items:center;justify-content:center;}
  .slideover{width:560px;max-width:94vw;background:var(--surface);height:100%;overflow-y:auto;box-shadow:var(--shadow);}
  .modal{width:520px;max-width:92vw;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);max-height:88vh;overflow-y:auto;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5;}
  .panel-body{padding:18px 20px 40px;}
  .form-row{margin-bottom:14px;}
  .form-row label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .form-row input[type=text],.form-row input[type=email],.form-row input[type=password],.form-row input[type=date],.form-row input[type=number],.form-row textarea,.form-row select{
    width:100%;border:1px solid var(--border);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:12.8px;font-family:inherit;
  }
  .form-row select:disabled{opacity:.6;cursor:not-allowed;}
  .form-row textarea{min-height:70px;resize:vertical;}
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checklist-row{display:flex;align-items:center;gap:8px;padding:5px 0;}
  .checklist-row input[type=text]{flex:1;border:none;background:transparent;border-bottom:1px dashed var(--border);padding:3px 2px;}
  .checklist-row.done input[type=text]{text-decoration:line-through;color:var(--muted);}
  .subtle-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:11.5px;}
  .subtle-btn:hover{color:var(--ink);}

  .taskhead-title{font-family:var(--font-display);font-size:19px;font-weight:700;margin-bottom:6px;}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:14px 0;padding:12px;background:var(--surface-2);border-radius:8px;font-size:12px;}
  .meta-grid .k{color:var(--muted);}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;margin:18px 0 8px;}
  .proof-link{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;font-size:12px;}
  .proof-link .ic{width:14px;height:14px;color:var(--accent);flex:none;}
  .att-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:7px;padding:5px 8px;font-size:11.5px;margin:0 6px 6px 0;}
  .comment{display:flex;gap:9px;margin-bottom:12px;}
  .comment-body{background:var(--surface-2);border-radius:9px;padding:8px 11px;flex:1;}
  .comment-head{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;margin-bottom:2px;}
  .comment-time{font-weight:400;color:var(--muted);}
  .mention{color:var(--accent);font-weight:700;}
  .history-row{display:flex;gap:8px;font-size:11.7px;padding:5px 0;border-bottom:1px dashed var(--border);}
  .history-row:last-child{border:none;}
  .sla-badge{display:inline-flex;align-items:center;gap:5px;font-size:11.3px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .close-x{cursor:pointer;color:var(--muted);width:20px;height:20px;}
  .close-x:hover{color:var(--ink);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:12.5px;}
  .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:92vw;}
  .toast{background:var(--ink);color:var(--paper);padding:10px 15px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow);animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* login */
  #login-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(circle at 15% 10%, var(--accent-soft), transparent 45%), var(--paper);padding:20px;}
  .login-card{width:400px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px 28px;box-shadow:var(--shadow);}
  .login-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
  .fieldnote{font-size:11px;color:var(--muted);margin-top:4px;}

  /* ---------- Mobile ---------- */
  @media (max-width:900px){
    #sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:85;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--shadow);
    }
    #sidebar.mobile-open{transform:translateX(0);}
    .navcollapse{display:none;}
    .mobile-menu-btn{display:flex;}
    .search-wrap{display:none;}
    #topbar{padding:0 12px;gap:8px;}
    .viewtitle{font-size:15px;max-width:130px;overflow:hidden;text-overflow:ellipsis;}
    #view-root{padding:14px 14px 50px;}
    .meta-grid{grid-template-columns:1fr;}
    .form-2col{grid-template-columns:1fr;}
    .cal-cell{min-height:64px;padding:4px;font-size:9.6px;}
    .cal-daynum{font-size:10px;margin-bottom:2px;}

    .slideover{width:100%;}
    .kpi-value{font-size:24px;}
  }
  @media (max-width:520px){
    .grid-kpi{grid-template-columns:repeat(2,1fr)!important;}
    .btn-text-hide{display:none;}
    .view-head h2{font-size:19px;}
  }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc,
    onSnapshot, query, where
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js";

  const firebaseConfig = {
    projectId: "lsba-dashboard",
    appId: "1:1091473656964:web:8eccfc77db6169c6c786d1",
    storageBucket: "lsba-dashboard.firebasestorage.app",
    apiKey: "AIzaSyAks9-t7d7IBQMp2PYyMLGotu9Md41qI5M",
    authDomain: "lsba-dashboard.firebaseapp.com",
    messagingSenderId: "1091473656964"
  };
  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const db = getFirestore(fbApp);
  setPersistence(auth, browserLocalPersistence).catch(()=>{});

  window.__fb = {
    auth, db, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut,
    collection, doc, addDoc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, query, where
  };
  window.__fbReady = true;
  window.dispatchEvent(new Event('fbready'));
</script>

<script>
/* ================= APP VERSION ================= */
const APP_VERSION = '2.0.0';
const ICONS = {
  dashboard:'<path d="M4 4h7v9H4zM13 4h7v5h-7zM13 12h7v8h-7zM4 16h7v4H4z"/>',
  tasks:'<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="4" cy="6" r="0"/>',
  kanban:'<path d="M4 4h4v16H4zM10 4h4v10h-4zM16 4h4v13h-4z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M4 20h16"/>',
  activity:'<path d="M3 12h4l2 8 4-16 2 8h6"/>',
  team:'<circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="18" cy="9" r="2.4"/><path d="M15.5 14.3c2.8.4 5 2.5 5 5.2"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 01-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 010-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 014 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9c.14.36.5 1 1.55 1H21a2 2 0 010 4h-.09a1.7 1.7 0 00-1.51 1z"/>',
};
const DEPARTMENTS = ['Content','Design','Social Media','SEO','Email Marketing','Operations','PR','Leadership'];
const CATEGORIES = ['Newsletter','Social Post','Blog Article','Campaign Report','Banner Design','SEO Audit','Press Release','Client Deliverable'];

const APPROVED_ROSTER = {
  'rishabh@accubooks.in': {name:'Rishabh', role:'admin', department:'Marketing'},
  'rahul@accubooks.in': {name:'Rahul', role:'admin', department:'Operations'},
  'aakriti@naaritive.com': {name:'Aakriti', role:'super_admin', department:'Leadership'},
  'aabhas@naaritive.com': {name:'Aabhas', role:'super_admin', department:'Leadership'},
  'mahak@accubooks.in': {name:'Mahak', role:'user', department:'Design'},
  'batrasaanvi2306@gmail.com': {name:'Saanvi', role:'user', department:'Social Media'},
};

function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function initials(name){ const parts = (name||'?').trim().split(/\s+/); return parts.length>1 ? (parts[0][0]+parts[1][0]).toUpperCase() : parts[0].slice(0,2).toUpperCase(); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function fmtDateFull(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateTime(d){ const dt = new Date(d); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' · ' + dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function isoDate(d){ return new Date(d).toISOString().slice(0,10); }
function addDays(d,n){ const dt = new Date(d); dt.setDate(dt.getDate()+n); return dt; }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function timeAgo(ts){
  const s = Math.round((Date.now()-new Date(ts).getTime())/1000);
  if(s<60) return 'just now';
  if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function userColor(u){ const idx = STATE.users.findIndex(x=>x.id===u.id) % 6; return `var(--cat-${(idx<0?0:idx)+1})`; }
function userById(id){ return STATE.users.find(u=>u.id===id); }
function taskById(id){ return STATE.tasks.find(t=>t.id===id); }

/* ================= STATE ================= */
let STATE = { currentUserId:null, users:[], tasks:[], notifications:[], holidays:[], slaDefaults:{High:24,Medium:48,Low:72} };

/* ================= AUTH ================= */
function currentUser(){ return userById(STATE.currentUserId); }
function isSuper(){ const u=currentUser(); return !!u && u.role==='super_admin'; }
function isAdmin(){ const u=currentUser(); return !!u && (u.role==='admin' || u.role==='super_admin'); }

function showLoginError(msg){ const el=document.getElementById('login-error'); el.textContent=msg; el.style.display='block'; }
function hideLoginError(){ const el=document.getElementById('login-error'); el.style.display='none'; }
function friendlyAuthError(e){
  const code = (e && e.code) || '';
  const map = {
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/wrong-password':'Incorrect email or password.',
    'auth/user-not-found':'No account found for that email — try "Create your account".',
    'auth/email-already-in-use':'An account already exists for that email — try Sign in instead.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/invalid-email':'That email address looks invalid.',
    'auth/too-many-requests':'Too many attempts — please wait a bit and try again.',
    'permission-denied':'This email is not on the approved team list. Contact your admin.',
  };
  return map[code] || (e && e.message) || 'Something went wrong — please try again.';
}
async function doSignIn(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  hideLoginError();
  if(!email || !password) return showLoginError('Enter your email and password.');
  try{ await window.__fb.signInWithEmailAndPassword(window.__fb.auth, email, password); }
  catch(e){ showLoginError(friendlyAuthError(e)); }
}
async function doSignUp(){
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  hideLoginError();
  if(!email || !password) return showLoginError('Enter your email and password.');
  if(password.length < 6) return showLoginError('Password must be at least 6 characters.');
  const roster = APPROVED_ROSTER[email];
  if(!roster) return showLoginError('This email is not on the approved team list. Contact your admin.');
  const {auth, db, doc, setDoc, createUserWithEmailAndPassword, signOut} = window.__fb;
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db,'users',cred.user.uid), {
      name: roster.name, email, role: roster.role, department: roster.department, active: true
    });
  }catch(e){ showLoginError(friendlyAuthError(e)); }
}
function logout(){ window.__fb.signOut(window.__fb.auth); }

async function safeGetProfile(uidVal){
  try{
    const {db, doc, getDoc} = window.__fb;
    const snap = await getDoc(doc(db,'users',uidVal));
    return snap.exists() ? snap : null;
  }catch(e){ return null; }
}
async function onAuthChanged(user){
  if(!user){
    if(unsubUsers) unsubUsers(); if(unsubTasks) unsubTasks(); if(unsubNotifs) unsubNotifs(); if(unsubMeta) unsubMeta();
    document.getElementById('app').classList.add('hidden');
    document.getElementById('login-view').classList.remove('hidden');
    return;
  }
  let profileSnap = await safeGetProfile(user.uid);
  if(!profileSnap){ await new Promise(r=>setTimeout(r,900)); profileSnap = await safeGetProfile(user.uid); }
  if(!profileSnap){
    showLoginError('Your account exists but has no profile yet. If you just signed up, please wait a moment and refresh.');
    return;
  }
  STATE.currentUserId = user.uid;
  subscribeAll(user.uid);
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildNav();
  if(!location.hash) location.hash = '#/dashboard';
  route();
}

/* ================= FIRESTORE SUBSCRIPTIONS ================= */
let unsubUsers=null, unsubTasks=null, unsubNotifs=null, unsubMeta=null;
function appVisible(){ return !document.getElementById('app').classList.contains('hidden'); }
function subscribeAll(uidVal){
  const {db, collection, doc, onSnapshot, query, where} = window.__fb;
  if(unsubUsers) unsubUsers();
  if(unsubTasks) unsubTasks();
  if(unsubNotifs) unsubNotifs();
  if(unsubMeta) unsubMeta();

  unsubUsers = onSnapshot(collection(db,'users'), snap=>{
    STATE.users = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(appVisible()) route();
  }, err=>console.error('users listener', err));

  unsubTasks = onSnapshot(collection(db,'tasks'), snap=>{
    STATE.tasks = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(appVisible()) route();
  }, err=>console.error('tasks listener', err));

  unsubNotifs = onSnapshot(query(collection(db,'notifications'), where('userId','==',uidVal)), snap=>{
    STATE.notifications = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(appVisible()) renderTopUser();
  }, err=>console.error('notifications listener', err));

  unsubMeta = onSnapshot(doc(db,'meta','config'), snap=>{
    const d = snap.exists() ? snap.data() : {};
    STATE.holidays = d.holidays || [];
    STATE.slaDefaults = d.slaDefaults || {High:24,Medium:48,Low:72};
    if(appVisible() && location.hash.replace('#/','')==='settings') renderSettings();
  }, err=>console.error('meta listener', err));
}
async function saveMeta(){
  const {db, doc, setDoc} = window.__fb;
  try{ await setDoc(doc(db,'meta','config'), {holidays: STATE.holidays, slaDefaults: STATE.slaDefaults}, {merge:true}); }
  catch(e){ toast('Could not save settings: '+(e.message||'permission denied')); }
}

/* ================= NAV / ROUTER ================= */
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', icon:'dashboard', roles:['user','admin','super_admin']},
  {id:'tasks', label:'Tasks', icon:'tasks', roles:['user','admin','super_admin']},
  {id:'kanban', label:'Kanban Board', icon:'kanban', roles:['user','admin','super_admin']},
  {id:'calendar', label:'Calendar', icon:'calendar', roles:['user','admin','super_admin']},
  {id:'reports', label:'Reports', icon:'reports', roles:['admin','super_admin']},
  {id:'activity', label:'Activity Log', icon:'activity', roles:['admin','super_admin']},
  {id:'team', label:'Team & Users', icon:'team', roles:['admin','super_admin']},
  {id:'settings', label:'Settings', icon:'settings', roles:['super_admin']},
];
function buildNav(){
  const u = currentUser(); if(!u) return;
  const role = u.role;
  const html = NAV_ITEMS.filter(n=>n.roles.includes(role)).map(n=>{
    const badge = n.id==='tasks' ? myOpenTaskCount() : (n.id==='reports' && isAdmin() ? pendingApprovalCount() : 0);
    return `<div class="navitem" data-route="${n.id}" onclick="location.hash='#/${n.id}'">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n.icon]}</svg>
      <span class="navlabel">${n.label}</span>
      ${badge?`<span class="badge">${badge}</span>`:''}
    </div>`;
  }).join('') + `<div class="navsection">Session</div>
    <div class="navitem" onclick="logout()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg><span class="navlabel">Log out</span></div>`;
  document.getElementById('nav-container').innerHTML = html;
}
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('collapsed'); }
function toggleMobileSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebar-backdrop').classList.toggle('hidden');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebar-backdrop').classList.add('hidden');
}

function myOpenTaskCount(){
  const uidVal = STATE.currentUserId;
  return STATE.tasks.filter(t=>t.assignedTo===uidVal && !['Completed','Approved'].includes(t.status)).length;
}
function pendingApprovalCount(){ return STATE.tasks.filter(t=>t.status==='Submitted').length; }
function roleLabel(r){ return r==='super_admin'?'Super Admin':r==='admin'?'Admin':'User'; }

function route(){
  if(!currentUser()) return;
  const hash = location.hash.replace('#/','') || 'dashboard';
  document.querySelectorAll('.navitem[data-route]').forEach(el=>el.classList.toggle('active', el.dataset.route===hash));
  const titles = {dashboard:'Dashboard', tasks:'Tasks', kanban:'Kanban Board', calendar:'Calendar', reports:'Reports & Analytics', activity:'Activity Log', team:'Team & Users', settings:'Settings'};
  document.getElementById('view-title').textContent = titles[hash] || 'Dashboard';
  const renderers = {dashboard:renderDashboard, tasks:renderTasks, kanban:renderKanban, calendar:renderCalendar, reports:renderReports, activity:renderActivityView, team:renderTeam, settings:renderSettings};
  buildNav();
  (renderers[hash] || renderDashboard)();
  renderTopUser();
  closeMobileSidebar();
}
window.addEventListener('hashchange', route);

function renderTopUser(){
  const u = currentUser(); if(!u) return;
  const av = document.getElementById('current-avatar');
  av.textContent = initials(u.name); av.style.background = userColor(u);
  const unread = STATE.notifications.filter(n=>!n.read).length;
  document.getElementById('notif-dot').style.display = unread ? 'block' : 'none';
}

/* ================= TOASTS ================= */
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent = msg;
  document.getElementById('toast-wrap').appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

/* ================= NOTIFICATIONS ================= */
function toggleNotif(){
  const panel = document.getElementById('notif-panel');
  const opening = panel.classList.contains('hidden');
  panel.classList.toggle('hidden');
  if(opening){
    const mine = STATE.notifications.slice().sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    document.getElementById('notif-list').innerHTML = mine.length ? mine.map(n=>`
      <div class="notif-item ${n.read?'read':'unread'}" onclick="openNotif('${n.id}')">
        <div class="notif-dot"></div>
        <div><div class="notif-text">${n.text}</div><div class="notif-time">${timeAgo(n.ts)}</div></div>
      </div>`).join('') : `<div class="empty">No notifications yet</div>`;
  }
}
async function openNotif(id){
  const n = STATE.notifications.find(x=>x.id===id);
  const {db, doc, updateDoc} = window.__fb;
  try{ await updateDoc(doc(db,'notifications',id), {read:true}); }catch(e){}
  document.getElementById('notif-panel').classList.add('hidden');
  if(n && n.taskId && taskById(n.taskId)) openTaskDetail(n.taskId);
}
async function markAllRead(){
  const {db, doc, updateDoc} = window.__fb;
  const unread = STATE.notifications.filter(n=>!n.read);
  for(const n of unread){ try{ await updateDoc(doc(db,'notifications',n.id), {read:true}); }catch(e){} }
  toggleNotif(); toggleNotif();
}
async function notify(userId, type, text, taskId){
  const {db, collection, addDoc} = window.__fb;
  try{ await addDoc(collection(db,'notifications'), {userId, type, text, taskId: taskId||null, ts:new Date().toISOString(), read:false}); }
  catch(e){ console.error('notify failed', e); }
}

/* ================= CHART HELPERS (inline SVG, per dataviz method) ================= */
let TOOLTIP = null;
function ensureTooltip(){ TOOLTIP = document.getElementById('chart-tooltip'); }
function showTip(evt, html){
  if(!TOOLTIP) ensureTooltip();
  TOOLTIP.innerHTML = html;
  TOOLTIP.style.left = evt.clientX+'px'; TOOLTIP.style.top = evt.clientY+'px';
  TOOLTIP.classList.add('show');
}
function hideTip(){ if(TOOLTIP) TOOLTIP.classList.remove('show'); }

function barChart(data, opts){
  opts = opts||{};
  const w = opts.width||420, h = opts.height||190, pad = {t:10,r:10,b:26,l:opts.horizontal?90:28};
  const max = Math.max(1, ...data.map(d=>d.value));
  let svg = '';
  if(opts.horizontal){
    const innerH = h - pad.t - pad.b, bw = Math.min(20, innerH/data.length - 8);
    const step = innerH/data.length;
    data.forEach((d,i)=>{
      const y = pad.t + i*step + (step-bw)/2;
      const bwidth = (w-pad.l-pad.r) * d.value/max;
      svg += `<text x="${pad.l-8}" y="${y+bw/2+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${d.label}</text>`;
      svg += `<rect x="${pad.l}" y="${y}" width="${Math.max(3,bwidth)}" height="${bw}" rx="4" fill="${d.color||'var(--accent)'}" class="bar-mark" data-tip="${d.label}: ${d.value}"/>`;
    });
  } else {
    const innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
    const step = innerW/data.length, bw = Math.min(34, step*0.55);
    for(let g=0; g<=3; g++){
      const gy = pad.t + innerH - (innerH*g/3);
      svg += `<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
    }
    data.forEach((d,i)=>{
      const bh = innerH * d.value/max;
      const x = pad.l + i*step + (step-bw)/2;
      const y = pad.t + innerH - bh;
      svg += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,bh)}" rx="4" fill="${d.color||'var(--accent)'}" class="bar-mark" data-tip="${d.label}: ${d.value}"/>`;
      svg += `<text x="${x+bw/2}" y="${h-8}" text-anchor="middle" font-size="10.3" fill="var(--muted)">${d.label}</text>`;
    });
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="chartsvg" onmousemove="chartHover(event)" onmouseleave="hideTip()">${svg}</svg>`;
}

function lineAreaChart(data, opts){
  opts = opts||{};
  const w = opts.width||520, h = opts.height||180, pad = {t:14,r:14,b:24,l:32};
  const max = Math.max(1, ...data.map(d=>d.value));
  const innerW = w-pad.l-pad.r, innerH = h-pad.t-pad.b;
  const step = data.length>1 ? innerW/(data.length-1) : 0;
  const pts = data.map((d,i)=>[pad.l+i*step, pad.t+innerH-(innerH*d.value/max)]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length-1][0]},${pad.t+innerH} L${pts[0][0]},${pad.t+innerH} Z`;
  let grid = '';
  for(let g=0; g<=3; g++){
    const gy = pad.t + innerH - (innerH*g/3);
    grid += `<line x1="${pad.l}" y1="${gy}" x2="${w-pad.r}" y2="${gy}" stroke="var(--border)" stroke-width="1"/>`;
  }
  const dots = pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="var(--accent)" class="line-mark" data-tip="${data[i].label}: ${data[i].value}"/>`).join('');
  const labels = data.map((d,i)=>`<text x="${pts[i][0]}" y="${h-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.label}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" class="chartsvg" onmousemove="chartHover(event)" onmouseleave="hideTip()">
    ${grid}
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}

function donutChart(data, opts){
  opts = opts||{};
  const size = opts.size||150, r = size/2-10, cx=size/2, cy=size/2, sw=16;
  const total = data.reduce((a,d)=>a+d.value,0) || 1;
  let angle = -90, svg='';
  data.forEach(d=>{
    const sweep = (d.value/total)*360;
    const large = sweep>180?1:0;
    const x1 = cx + r*Math.cos(angle*Math.PI/180), y1 = cy + r*Math.sin(angle*Math.PI/180);
    const end = angle+sweep;
    const x2 = cx + r*Math.cos(end*Math.PI/180), y2 = cy + r*Math.sin(end*Math.PI/180);
    svg += `<path d="M${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2}" fill="none" stroke="${d.color}" stroke-width="${sw}" class="line-mark" data-tip="${d.label}: ${d.value}"/>`;
    angle = end;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="chartsvg" onmousemove="chartHover(event)" onmouseleave="hideTip()">${svg}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="var(--font-display)">${total}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="9.5" fill="var(--muted)">total</text>
  </svg>`;
}

function sparkline(values, opts){
  opts = opts||{};
  const w=opts.width||90, h=opts.height||28;
  const max = Math.max(...values,1), min = Math.min(...values,0);
  const range = (max-min)||1;
  const step = w/(values.length-1);
  const pts = values.map((v,i)=>[i*step, h-((v-min)/range)*h]);
  const line = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.4" fill="var(--accent)"/></svg>`;
}

function chartHover(evt){
  const t = evt.target.closest('[data-tip]');
  if(t) showTip(evt, t.getAttribute('data-tip')); else hideTip();
}
function legendRow(items){
  return `<div class="legend">${items.map(i=>`<div class="legend-item"><span class="legend-swatch" style="background:${i.color}"></span>${i.label}</div>`).join('')}</div>`;
}

/* ================= RECURRENCE ENGINE ================= */
function nextDueDate(fromDate, rec){
  let d = new Date(fromDate);
  const step = rec.interval||1;
  if(rec.freq==='daily') d = addDays(d, step);
  else if(rec.freq==='weekly') d = addDays(d, 7*step);
  else if(rec.freq==='monthly') d.setMonth(d.getMonth()+step);
  else if(rec.freq==='quarterly') d.setMonth(d.getMonth()+3*step);
  else if(rec.freq==='yearly') d.setFullYear(d.getFullYear()+step);
  else if(rec.freq==='custom') d = addDays(d, (rec.customDays||7));
  if(rec.skipHolidays){
    while(isWeekendOrHoliday(d)) d = addDays(d,1);
  }
  return d;
}
function isWeekendOrHoliday(d){
  const day = new Date(d).getDay();
  const iso = isoDate(d);
  return day===0 || day===6 || STATE.holidays.includes(iso);
}
async function maybeSpawnRecurring(task){
  if(!task.recurrence) return;
  const rec = task.recurrence;
  const next = nextDueDate(task.dueDate, rec);
  if(rec.endDate && new Date(next) > new Date(rec.endDate)) return;
  const clone = JSON.parse(JSON.stringify(task));
  delete clone.id;
  clone.status = 'Pending';
  clone.dueDate = isoDate(next);
  clone.createdDate = isoDate(new Date());
  clone.updatedDate = clone.createdDate;
  clone.submittedAt=null; clone.approvedAt=null; clone.approvedBy=null; clone.approvalNotes=''; clone.rejectionNotes='';
  clone.comments = []; clone.proofLinks = []; clone.attachments = [];
  clone.checklist = (clone.checklist||[]).map(c=>({...c, done:false}));
  clone.history = [{ts:new Date().toISOString(), userId:STATE.currentUserId, action:'Recurring Task Created', detail:'Auto-generated from completed occurrence'}];
  const {db, collection, addDoc} = window.__fb;
  try{
    const ref = await addDoc(collection(db,'tasks'), clone);
    await notify(clone.assignedTo, 'recurring', `New recurring task assigned: "${clone.title}" (due ${fmtDate(clone.dueDate)}).`, ref.id);
    toast('Next recurring occurrence created: due ' + fmtDate(clone.dueDate));
  }catch(e){ console.error('recurring spawn failed', e); }
}

/* ================= TASK MUTATIONS ================= */
async function setStatus(task, status, extra){
  const prev = task.status;
  task.status = status;
  Object.assign(task, extra||{});
  logHistory(task, 'Status Changed', `${prev} → ${status}`);
  const {db, doc, updateDoc} = window.__fb;
  try{
    await updateDoc(doc(db,'tasks',task.id), {status:task.status, ...(extra||{}), history:task.history, updatedDate:task.updatedDate});
  }catch(e){ toast('Update failed: '+(e.message||'permission denied')); return; }
  if(status==='Completed' && prev!=='Completed'){ await maybeSpawnRecurring(task); }
}
async function submitForApproval(taskId, comment, links){
  const t = taskById(taskId);
  t.comments = t.comments||[]; t.proofLinks = t.proofLinks||[];
  t.comments.push({id:uid('cm'), userId:STATE.currentUserId, text:comment, ts:new Date().toISOString()});
  t.proofLinks.push(...links);
  const {db, doc, updateDoc} = window.__fb;
  try{ await updateDoc(doc(db,'tasks',t.id), {comments:t.comments, proofLinks:t.proofLinks}); }
  catch(e){ toast('Submit failed: '+(e.message||'permission denied')); return; }
  await setStatus(t, 'Submitted', {submittedAt:new Date().toISOString()});
  await notify(t.assignedBy, 'submitted', `${currentUser().name} submitted "${t.title}" for approval.`, t.id);
  toast('Submitted for approval');
}

async function rejectTask(taskId, notes){

  await setStatus(t, 'Rejected', {rejectionNotes:notes});
  await notify(t.assignedTo, 'rejected', `Your task "${t.title}" needs revisions.`, t.id);

async function addComment(taskId, text){
  const t = taskById(taskId);
  t.comments = t.comments||[];
  t.comments.push({id:uid('cm'), userId:STATE.currentUserId, text, ts:new Date().toISOString()});
  logHistory(t,'Comment Added', text.slice(0,60));
  const {db, doc, updateDoc} = window.__fb;
  try{ await updateDoc(doc(db,'tasks',t.id), {comments:t.comments, history:t.history}); }

    if(u) await notify(u.id,'mention', `${currentUser().name} mentioned you on "${t.title}".`, t.id);

async function toggleChecklist(taskId, itemId){

function computeKPIs(){
  const tasks = STATE.tasks;
  const today = isoDate(new Date());
  const total = tasks.length;
  const byStatus = s => tasks.filter(t=>t.status===s).length;
  const overdue = tasks.filter(t=> new Date(t.dueDate) < new Date(today) && !['Completed','Approved'].includes(t.status)).length;
  const completed = byStatus('Completed');
  const rate = total ? Math.round((completed/total)*100) : 0;
  const approvedTasks = tasks.filter(t=>t.approvedAt && t.submittedAt);
  const avgApproval = approvedTasks.length ? Math.round(approvedTasks.reduce((a,t)=>a+Math.max(0,daysBetween(t.submittedAt,t.approvedAt)*24 + 6),0)/approvedTasks.length) : 0;
  const avgCompletion = completed ? Math.round(tasks.filter(t=>t.status==='Completed').reduce((a,t)=>a+Math.max(1,daysBetween(t.createdDate,t.updatedDate)),0)/completed) : 0;
  const dueThisWeek = tasks.filter(t=> daysBetween(today,t.dueDate)>=0 && daysBetween(today,t.dueDate)<=7 && !['Completed'].includes(t.status)).length;
  const overduePct = total ? Math.round((overdue/total)*100) : 0;
  const slaOk = approvedTasks.filter(t=>t.submittedAt && (new Date(t.approvedAt)-new Date(t.submittedAt))/3600000 <= (t.slaHours||48)).length;
  const slaPerf = approvedTasks.length ? Math.round((slaOk/approvedTasks.length)*100) : 100;
  return {total, byStatus, overdue, completed, rate, avgApproval, avgCompletion, dueThisWeek, overduePct, slaPerf};
}

function userDashboardHTML(){

async function bulkChangePriority(){
  const p = prompt('Set priority for selected tasks (High / Medium / Low):','High');
  if(!p || !['High','Medium','Low'].includes(p)) return;
  const {db, doc, updateDoc} = window.__fb;
  for(const id of SELECTED_TASKS){
    const t=taskById(id); if(!t) continue;
    t.priority=p; logHistory(t,'Priority Changed',p);
    try{ await updateDoc(doc(db,'tasks',id), {priority:p, history:t.history}); }catch(e){}
  }
  renderTasks(); toast('Priority updated for '+SELECTED_TASKS.size+' tasks');
}
async function bulkChangeDue(){
  const d = prompt('New due date (YYYY-MM-DD):', isoDate(new Date()));
  if(!d) return;
  const {db, doc, updateDoc} = window.__fb;
  for(const id of SELECTED_TASKS){
    const t=taskById(id); if(!t) continue;
    t.dueDate=d; logHistory(t,'Due Date Changed',d);
    try{ await updateDoc(doc(db,'tasks',id), {dueDate:d, history:t.history}); }catch(e){}
  }
  renderTasks(); toast('Due date updated');
}
async function bulkAssign(){
  const names = STATE.users.map(u=>u.name).join(', ');
  const name = prompt('Reassign selected tasks to (type full name):\n'+names);
  const u = STATE.users.find(u=>u.name.toLowerCase()===(name||'').toLowerCase());
  if(!u) return toast('User not found');
  const {db, doc, updateDoc} = window.__fb;
  for(const id of SELECTED_TASKS){
    const t=taskById(id); if(!t) continue;
    t.assignedTo=u.id; logHistory(t,'Reassigned',u.name);
    try{ await updateDoc(doc(db,'tasks',id), {assignedTo:u.id, history:t.history}); await notify(u.id,'assigned',`You were assigned "${t.title}".`,t.id); }catch(e){}
  }
  renderTasks(); toast('Reassigned to '+u.name);
}
async function bulkApprove(){
  for(const id of [...SELECTED_TASKS]){
    const t=taskById(id); if(t && t.status==='Submitted') await approveTask(id,'Bulk approved');
  }
  SELECTED_TASKS.clear(); renderTasks(); toast('Submitted tasks approved');
}
async function bulkDelete(){
  if(!confirm('Delete '+SELECTED_TASKS.size+' tasks?')) return;
  const {db, doc, deleteDoc} = window.__fb;
  for(const id of SELECTED_TASKS){ try{ await deleteDoc(doc(db,'tasks',id)); }catch(e){} }
  SELECTED_TASKS.clear(); renderTasks(); toast('Deleted');
}
function exportCSV(list){
  const cols = ['id','title','category','department','priority','assignedTo','status','dueDate','createdDate'];
  const rows = [cols.join(',')].concat(list.map(t=>cols.map(c=>{
    let v = c==='assignedTo' ? (userById(t.assignedTo)||{name:''}).name : t[c];
    v = String(v??'').replace(/"/g,'""');
    return /[,"\n]/.test(v) ? `"${v}"` : v;
  }).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'lsba-tasks-'+isoDate(new Date())+'.csv'; a.click();
  toast('CSV exported ('+list.length+' rows)');
}

function kcardHTML(t){
  const u = userById(t.assignedTo) || {name:'Unknown'};

function onKanbanDragStart(e){ e.dataTransfer.setData('text/plain', e.target.dataset.id); e.target.classList.add('dragging'); }
async function onKanbanDrop(e, col){
  e.preventDefault(); e.currentTarget.classList.remove('dragover');
  const id = e.dataTransfer.getData('text/plain');
  const t = taskById(id);
  if(!t) return;
  if(col==='Submitted' && t.status!=='Submitted'){ openSubmitModal(id); return; }
  if(col==='Approved' && !isAdmin()){ toast('Only Admins can approve tasks'); return; }
  await setStatus(t, col, col==='Submitted'?{submittedAt:new Date().toISOString()}:col==='Approved'?{approvedAt:new Date().toISOString(),approvedBy:STATE.currentUserId}:{});
  renderKanban();
}

/* ================= CALENDAR ================= */
let CAL_MONTH = new Date();
function renderCalendar(){
  const root = document.getElementById('view-root');
  const y = CAL_MONTH.getFullYear(), m = CAL_MONTH.getMonth();
  const first = new Date(y,m,1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, other:true, date:new Date(y,m-1,prevDays-i)});
  for(let d=1;d<=daysInMonth;d++) cells.push({d, other:false, date:new Date(y,m,d)});
  while(cells.length % 7 !== 0 || cells.length<35) cells.push({d:cells.length-daysInMonth-startDow+1, other:true, date:new Date(y,m+1,cells.length-daysInMonth-startDow+1)});

  const list = visibleTasks();
  const todayIso = isoDate(new Date());

  root.innerHTML = `<div class="view-head"><div><h2>Calendar</h2><p>${CAL_MONTH.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</p></div>
    <div class="head-actions">
      <button class="btn sm" onclick="calNav(-1)">&lsaquo; Prev</button>
      <button class="btn sm" onclick="CAL_MONTH=new Date();renderCalendar()">Today</button>
      <button class="btn sm" onclick="calNav(1)">Next &rsaquo;</button>
    </div></div>
    <div class="card">
    <div class="cal-grid" style="margin-bottom:6px">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">
    ${cells.map(c=>{
      const iso = isoDate(c.date);
      const dayTasks = list.filter(t=>t.dueDate===iso);
      return `<div class="cal-cell ${c.other?'other-month':''} ${iso===todayIso?'today':''}">
        <div class="cal-daynum">${c.d}</div>
        ${dayTasks.slice(0,3).map(t=>`<div class="cal-chip pr-${t.priority}" onclick="openTaskDetail('${t.id}')" title="${t.title}">${t.title}</div>`).join('')}
        ${dayTasks.length>3?`<div class="card-sub">+${dayTasks.length-3} more</div>`:''}
      </div>`;
    }).join('')}
    </div>
    </div>`;
}
function calNav(dir){ CAL_MONTH.setMonth(CAL_MONTH.getMonth()+dir); renderCalendar(); }

      <div class="form-row"><label>Slack integration</label><select onchange="toast('Not connected yet — connect a real workspace to enable')"><option>Not connected</option><option>Connect Slack…</option></select></div>
      <div class="form-row"><label>Microsoft Teams integration</label><select onchange="toast('Not connected yet — connect a real tenant to enable')"><option>Not connected</option><option>Connect Teams…</option></select></div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">Holidays (skipped by recurring tasks)</div>
      <div id="holiday-list">${STATE.holidays.map(h=>`<div class="proof-link"><span>${fmtDateFull(h)}</span><button class="subtle-btn" style="margin-left:auto" onclick="removeHoliday('${h}')">Remove</button></div>`).join('') || '<div class="card-sub">None added</div>'}</div>
      <div class="form-row" style="margin-top:10px"><input type="date" id="new-holiday" class="field-input"><button class="btn sm" style="margin-top:8px" onclick="addHoliday()">Add holiday</button></div>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:10px">About</div>
      <p class="card-sub" style="margin-bottom:6px">LSBA Dashboard, version <b class="num">${APP_VERSION}</b>.</p>
      <p class="card-sub">Signed in as ${currentUser().name} (${roleLabel(currentUser().role)}). Data is synced live via Firebase for everyone on the approved roster.</p>
    </div>
  </div>`;
}
function updateSla(p, val){ STATE.slaDefaults[p] = +val; saveMeta(); toast('SLA updated'); }
async function addHoliday(){
  const v = document.getElementById('new-holiday').value; if(!v) return;
  STATE.holidays.push(v); await saveMeta(); renderSettings();
}
async function removeHoliday(h){
  STATE.holidays = STATE.holidays.filter(x=>x!==h); await saveMeta(); renderSettings();
}

/* ================= TASK DETAIL SLIDEOVER ================= */
function openTaskDetail(id){
  const t = taskById(id); if(!t) return;
  const overlay = document.getElementById('task-overlay');
  document.getElementById('task-slideover').innerHTML = taskDetailHTML(t);
  overlay.classList.remove('hidden');
}
function closeSlideover(){ document.getElementById('task-overlay').classList.add('hidden'); }

function slaBadge(t){
  if(t.status!=='Submitted' || !t.submittedAt) return '';
  const dueBy = new Date(t.submittedAt).getTime() + (t.slaHours||48)*3600000;
  const hoursLeft = Math.round((dueBy - Date.now())/3600000);
  const overdue = hoursLeft < 0;
  return `<span class="sla-badge" style="background:${overdue?'var(--crit-soft)':hoursLeft<6?'var(--warn-soft)':'var(--good-soft)'};color:${overdue?'var(--crit)':hoursLeft<6?'var(--warn)':'var(--good)'}">
    ${overdue? 'SLA breached '+Math.abs(hoursLeft)+'h ago' : 'SLA: '+hoursLeft+'h left'}
  </span>`;
}

function taskDetailHTML(t){
  const assignee = userById(t.assignedTo) || {name:'Unknown'}, assigner = userById(t.assignedBy) || {name:'Unknown'};
  const canApprove = isAdmin() && t.status==='Submitted';
  const isMine = t.assignedTo===STATE.currentUserId;
  const checklist = t.checklist || [];
  const checklistDone = checklist.filter(c=>c.done).length;
  const comments = t.comments || [];
  const proofLinks = t.proofLinks || [];
  const attachments = t.attachments || [];
  const history = t.history || [];
  const tags = t.tags || [];
  return `
  <div class="panel-head">
    <div style="display:flex;align-items:center;gap:8px">${pill(t.status,'status',t.status)}${pill(t.priority,'pr')}${slaBadge(t)}</div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="iconbtn" title="Duplicate" onclick="duplicateTask('${t.id}')">&#10697;</button>
      ${isAdmin()?`<button class="iconbtn" title="Delete" onclick="deleteTask('${t.id}')">&#10005;</button>`:''}
      <svg class="close-x" onclick="closeSlideover()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
  </div>
  <div class="panel-body">
    <div class="taskhead-title">${t.title}</div>
    <p class="card-sub">${t.description || 'No description provided.'}</p>

    <div class="meta-grid">
      <div><span class="k">Assigned to</span><br>${assignee.name}</div>
      <div><span class="k">Assigned by</span><br>${assigner.name}</div>
      <div><span class="k">Category</span><br>${t.category}</div>
      <div><span class="k">Department</span><br>${t.department}</div>
      <div><span class="k">Due date</span><br class="num">${fmtDateFull(t.dueDate)} ${isOverdue(t)?'<span class="pill overdue">overdue</span>':''}</div>
      <div><span class="k">Estimated time</span><br>${t.estHours}h</div>
      <div><span class="k">Created</span><br>${fmtDateFull(t.createdDate)}</div>
      <div><span class="k">Last updated</span><br>${fmtDateFull(t.updatedDate)}</div>
    </div>

    ${t.recurrence ? `<div class="card" style="background:var(--accent-soft);border-color:transparent;margin-bottom:8px">
      <b style="font-size:12px">&#8635; Recurring — ${t.recurrence.freq}</b>
      <div class="card-sub">Every ${t.recurrence.interval} ${t.recurrence.freq==='custom'?'days':t.recurrence.freq.replace('ly','')}(s) · ${t.recurrence.skipHolidays?'skips weekends/holidays':'no skip'} · ${t.recurrence.endDate?'ends '+fmtDate(t.recurrence.endDate):'no end date'}</div>
    </div>` : ''}

    ${tags.length ? `<div style="margin-bottom:10px">${tags.map(tag=>`<span class="tag">#${tag}</span> `).join('')}</div>` : ''}

    <div class="section-title">Checklist ${checklist.length?`(${checklistDone}/${checklist.length})`:''}</div>
    ${checklist.length? checklist.map(c=>`<div class="checklist-row ${c.done?'done':''}"><input type="checkbox" class="checkbox" ${c.done?'checked':''} onchange="toggleChecklist('${t.id}','${c.id}');openTaskDetail('${t.id}')"><span style="flex:1">${c.text}</span></div>`).join('') : '<div class="card-sub">No subtasks</div>'}

    <div class="section-title">Proof of Completion</div>
    ${proofLinks.length? proofLinks.map(l=>`<div class="proof-link"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1.5-1.5"/></svg><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.type}: ${l.url}</a></div>`).join('') : '<div class="card-sub">No proof submitted yet</div>'}
    ${attachments.length? `<div style="margin-top:6px">${attachments.map(a=>`<span class="att-chip">&#128206; ${a.name}</span>`).join('')}</div>`:''}

    ${t.status==='Rejected' && t.rejectionNotes ? `<div class="card" style="background:var(--crit-soft);border-color:transparent;margin:10px 0"><b style="font-size:12px;color:var(--crit)">Rejection notes</b><div class="card-sub" style="color:var(--crit)">${t.rejectionNotes}</div></div>` : ''}
    ${t.status==='Approved'||t.status==='Completed' ? `<div class="card" style="background:var(--good-soft);border-color:transparent;margin:10px 0"><b style="font-size:12px;color:var(--good)">Approved by ${t.approvedBy && userById(t.approvedBy) ? userById(t.approvedBy).name : ''} · ${t.approvedAt?fmtDateTime(t.approvedAt):''}</b>${t.approvalNotes?`<div class="card-sub" style="color:var(--good)">${t.approvalNotes}</div>`:''}</div>` : ''}

    <div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap">
      ${isMine && !['Submitted','Approved','Completed'].includes(t.status) ? `<button class="btn primary" onclick="openSubmitModal('${t.id}')">Submit for Approval</button>` : ''}
      ${canApprove ? `<button class="btn primary" onclick="openApproveModal('${t.id}',true)">Approve</button><button class="btn danger" onclick="openApproveModal('${t.id}',false)">Reject</button>` : ''}
      ${isAdmin() ? `<button class="btn" onclick="openTaskModal('${t.id}')">Edit Task</button>` : ''}
    </div>

    <div class="section-title">Comments</div>
    ${comments.length? comments.map(c=>commentHTML(c)).join('') : '<div class="card-sub" style="margin-bottom:10px">No comments yet</div>'}
    <div style="display:flex;gap:8px;margin-top:6px">
      <input type="text" id="comment-input" class="field-input" placeholder="Add a comment — use @Name to mention" style="flex:1">
      <button class="btn" onclick="submitComment('${t.id}')">Post</button>
    </div>

    <div class="section-title">Version History &amp; Audit Trail</div>
    ${history.slice().reverse().map(h=>`<div class="history-row"><span class="mono card-sub">${fmtDateTime(h.ts)}</span><span><b>${userById(h.userId)?userById(h.userId).name:'System'}</b> — ${h.action}${h.detail?': '+h.detail:''}</span></div>`).join('')}
  </div>`;
}
function commentHTML(c){
  const u = userById(c.userId) || {id:'?', name:'Unknown'};
  const text = c.text.replace(/@([A-Za-z ]+)/g,'<span class="mention">@$1</span>');
  return `<div class="comment"><div class="avatar" style="background:${userColor(u)}">${initials(u.name)}</div>
    <div class="comment-body"><div class="comment-head"><span>${u.name}</span><span class="comment-time">${timeAgo(c.ts)}</span></div>${text}</div></div>`;
}
function submitComment(taskId){
  const input = document.getElementById('comment-input');
  if(!input.value.trim()) return;
  addComment(taskId, input.value.trim()).then(()=> openTaskDetail(taskId));
}

/* ================= SUBMIT / APPROVE MODALS ================= */
function openSubmitModal(taskId){
  document.getElementById('modal-root').innerHTML = `
    <div class="panel-head"><b>Submit for Approval</b><svg class="close-x" onclick="closeModal()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="panel-body">
      <div class="form-row"><label>Final comment (required)</label><textarea id="sub-comment" placeholder="Summarize what you completed…"></textarea></div>
      <div class="form-row"><label>Proof link type</label>
        <select id="sub-link-type">${['Instagram','LinkedIn','Facebook','Twitter/X','Google Drive','YouTube','Website'].map(o=>`<option>${o}</option>`).join('')}</select>
      </div>
      <div class="form-row"><label>Proof link URL</label><input type="text" id="sub-link-url" placeholder="https://…"></div>
      <div class="fieldnote" style="margin-bottom:10px">You can add more links or files after submitting, via comments.</div>
      <button class="btn primary" style="width:100%;justify-content:center" onclick="confirmSubmit('${taskId}')">Submit for Approval</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
async function confirmSubmit(taskId){
  const comment = document.getElementById('sub-comment').value.trim();
  if(!comment) return toast('A final comment is required');
  const url = document.getElementById('sub-link-url').value.trim();
  const type = document.getElementById('sub-link-type').value;
  const links = url ? [{type, url}] : [];
  await submitForApproval(taskId, comment, links);
  closeModal(); closeSlideover(); route();
}
function openApproveModal(taskId, approve){
  document.getElementById('modal-root').innerHTML = `
    <div class="panel-head"><b>${approve?'Approve Task':'Reject Task'}</b><svg class="close-x" onclick="closeModal()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="panel-body">
      <div class="form-row"><label>${approve?'Approval notes (optional)':'Rejection notes (required)'}</label><textarea id="ap-notes" placeholder="${approve?'Nice work…':'What needs to change?'}"></textarea></div>
      <button class="btn ${approve?'primary':'danger'}" style="width:100%;justify-content:center" onclick="confirmApprove('${taskId}',${approve})">${approve?'Confirm Approval':'Confirm Rejection'}</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
async function confirmApprove(taskId, approve){
  const notes = document.getElementById('ap-notes').value.trim();
  if(approve) await approveTask(taskId, notes); else { if(!notes) return toast('Rejection notes are required'); await rejectTask(taskId, notes); }
  closeModal(); closeSlideover(); route();
}
function closeModal(){ document.getElementById('modal-overlay').classList.add('hidden'); }

/* ================= CREATE / EDIT TASK MODAL ================= */
function openTaskModal(taskId){
  const t = taskId ? taskById(taskId) : null;
  const allUsers = STATE.users.filter(u=>u.active);
  const assigneeChoices = isAdmin() ? allUsers : allUsers.filter(u=>u.id===STATE.currentUserId);
  document.getElementById('modal-root').innerHTML = `
    <div class="panel-head"><b>${t?'Edit Task':'New Task'}</b><svg class="close-x" onclick="closeModal()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></div>
    <div class="panel-body">
      <div class="form-row"><label>Title</label><input type="text" id="f-title" value="${t?t.title.replace(/"/g,'&quot;'):''}" placeholder="e.g. Publish Newsletter"></div>
      <div class="form-row"><label>Description</label><textarea id="f-desc">${t?(t.description||''):''}</textarea></div>
      <div class="form-2col">
        <div class="form-row"><label>Category</label><select id="f-category">${CATEGORIES.map(c=>`<option ${t&&t.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="form-row"><label>Department</label><select id="f-dept">${DEPARTMENTS.map(d=>`<option ${t&&t.department===d?'selected':''}>${d}</option>`).join('')}</select></div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>Priority</label><select id="f-priority">${['High','Medium','Low'].map(p=>`<option ${t&&t.priority===p?'selected':''}>${p}</option>`).join('')}</select></div>
        <div class="form-row"><label>Assign to</label><select id="f-assignee" ${isAdmin()?'':'disabled'}>${assigneeChoices.map(u=>`<option value="${u.id}" ${t&&t.assignedTo===u.id?'selected':''}>${u.name}</option>`).join('')}</select>${isAdmin()?'':'<div class="fieldnote">Users can only assign tasks to themselves.</div>'}</div>
      </div>
      <div class="form-2col">
        <div class="form-row"><label>Due date</label><input type="date" id="f-due" value="${t?t.dueDate:isoDate(new Date())}"></div>
        <div class="form-row"><label>Estimated hours</label><input type="number" id="f-est" value="${t?t.estHours:3}"></div>
      </div>
      <div class="form-row"><label>Tags (comma separated)</label><input type="text" id="f-tags" value="${t?(t.tags||[]).join(', '):''}"></div>

      <div class="form-row"><label>Checklist / Subtasks</label>
        <div id="f-checklist">${(t?(t.checklist||[]):[]).map(c=>checklistFieldRow(c.text,c.done)).join('')}</div>
        <button type="button" class="subtle-btn" onclick="addChecklistField()">+ Add subtask</button>
      </div>

      <div class="form-row">
        <label><input type="checkbox" id="f-recurring" ${t&&t.recurrence?'checked':''} onchange="document.getElementById('recurrence-box').style.display=this.checked?'block':'none'"> Make this a recurring task</label>
      </div>
      <div id="recurrence-box" class="card" style="display:${t&&t.recurrence?'block':'none'};background:var(--surface-2);border-color:transparent;margin-bottom:14px">
        <div class="form-2col">
          <div class="form-row"><label>Frequency</label><select id="f-freq">${['daily','weekly','monthly','quarterly','yearly','custom'].map(f=>`<option value="${f}" ${t&&t.recurrence&&t.recurrence.freq===f?'selected':''}>${f[0].toUpperCase()+f.slice(1)}</option>`).join('')}</select></div>
          <div class="form-row"><label>Repeat every (interval)</label><input type="number" id="f-interval" value="${t&&t.recurrence?t.recurrence.interval:1}"></div>
        </div>
        <div class="form-2col">
          <div class="form-row"><label>End date (optional)</label><input type="date" id="f-recur-end" value="${t&&t.recurrence?t.recurrence.endDate:''}"></div>
          <div class="form-row"><label>Skip weekends/holidays</label><select id="f-skip"><option value="true" ${t&&t.recurrence&&t.recurrence.skipHolidays?'selected':''}>Yes</option><option value="false" ${t&&t.recurrence&&!t.recurrence.skipHolidays?'selected':''}>No</option></select></div>
        </div>
      </div>

      <div class="form-row"><label>Start from template (optional)</label>
        <select id="f-template" onchange="applyTemplate(this.value)">
          <option value="">— none —</option>
          <option value="newsletter">Weekly Newsletter</option>
          <option value="social">Social Media Post</option>
          <option value="report">Campaign Report</option>
        </select>
      </div>

      <button class="btn primary" style="width:100%;justify-content:center" onclick="saveTaskForm('${t?t.id:''}')">${t?'Save Changes':'Create Task'}</button>
    </div>`;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function checklistFieldRow(text,done){
  return `<div class="checklist-row"><input type="checkbox" class="checkbox" ${done?'checked':''}><input type="text" value="${(text||'').replace(/"/g,'&quot;')}" placeholder="Subtask…"><button type="button" class="subtle-btn" onclick="this.parentElement.remove()">&#10005;</button></div>`;
}
function addChecklistField(){ document.getElementById('f-checklist').insertAdjacentHTML('beforeend', checklistFieldRow('',false)); }
const TEMPLATES = {
  newsletter:{title:'Publish weekly newsletter', category:'Newsletter', department:'Content', priority:'Medium', checklist:['Draft copy','Design header','QA links','Schedule send']},
  social:{title:'Create social media post', category:'Social Post', department:'Social Media', priority:'Low', checklist:['Write caption','Design asset','Get approval','Schedule post']},
  report:{title:'Prepare campaign performance report', category:'Campaign Report', department:'Marketing', priority:'High', checklist:['Pull analytics','Summarize insights','Design slides','Send to client']},
};
function applyTemplate(key){
  if(!key) return;
  const tpl = TEMPLATES[key];
  document.getElementById('f-title').value = tpl.title;
  document.getElementById('f-category').value = tpl.category;
  document.getElementById('f-dept').value = tpl.department;
  document.getElementById('f-priority').value = tpl.priority;
  document.getElementById('f-checklist').innerHTML = tpl.checklist.map(c=>checklistFieldRow(c,false)).join('');
}
async function saveTaskForm(taskId){
  const title = document.getElementById('f-title').value.trim();
  if(!title) return toast('Title is required');
  const checklist = [...document.getElementById('f-checklist').querySelectorAll('.checklist-row')].map(row=>({
    id: uid('c'), text: row.querySelector('input[type=text]').value.trim(), done: row.querySelector('input[type=checkbox]').checked
  })).filter(c=>c.text);
  const isRecurring = document.getElementById('f-recurring').checked;
  const recurrence = isRecurring ? {
    freq: document.getElementById('f-freq').value, interval: +document.getElementById('f-interval').value || 1,
    startDate: isoDate(new Date()), endDate: document.getElementById('f-recur-end').value,
    skipHolidays: document.getElementById('f-skip').value==='true', autoAssign:true
  } : null;
  const assigneeEl = document.getElementById('f-assignee');
  const assignedTo = isAdmin() ? assigneeEl.value : STATE.currentUserId;
  const fields = {
    title, description: document.getElementById('f-desc').value.trim(),
    category: document.getElementById('f-category').value, department: document.getElementById('f-dept').value,
    priority: document.getElementById('f-priority').value, assignedTo,
    dueDate: document.getElementById('f-due').value, estHours: +document.getElementById('f-est').value || 1,
    tags: document.getElementById('f-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
    checklist, recurrence,
  };
  const {db, doc, collection, addDoc, updateDoc} = window.__fb;
  if(taskId){
    const t = taskById(taskId);
    Object.assign(t, fields);
    logHistory(t, 'Task Edited', 'Fields updated');
    try{ await updateDoc(doc(db,'tasks',taskId), {...fields, history:t.history, updatedDate:t.updatedDate}); toast('Task updated'); }
    catch(e){ toast('Update failed: '+(e.message||'permission denied')); return; }
  } else {
    const t = Object.assign({
      assignedBy: STATE.currentUserId, createdDate: isoDate(new Date()), updatedDate: isoDate(new Date()),
      status:'Pending', labels:[], attachments:[], proofLinks:[], comments:[], history:[],
      slaHours: STATE.slaDefaults[fields.priority]||48, submittedAt:null, approvedAt:null, approvedBy:null, approvalNotes:'', rejectionNotes:'',
    }, fields);
    t.history.push({ts:new Date().toISOString(), userId:STATE.currentUserId, action:'Task Created', detail:title});
    try{
      const ref = await addDoc(collection(db,'tasks'), t);
      if(t.assignedTo !== STATE.currentUserId) await notify(t.assignedTo, 'assigned', `${currentUser().name} assigned you "${t.title}".`, ref.id);
      toast('Task created');
    }catch(e){ toast('Create failed: '+(e.message||'permission denied')); return; }
  }
  closeModal(); route();
}

/* ================= INIT ================= */
function whenFirebaseReady(cb){
  if(window.__fbReady) cb(); else window.addEventListener('fbready', cb, {once:true});
}
function startApp(){
  ensureTooltip();
  const vLogin = document.getElementById('version-badge-login'); if(vLogin) vLogin.textContent = 'v' + APP_VERSION;
  const vSide = document.getElementById('version-badge-sidebar'); if(vSide) vSide.textContent = 'v' + APP_VERSION;
  document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target.id==='modal-overlay') closeModal(); });
  document.getElementById('task-overlay').addEventListener('click', e=>{ if(e.target.id==='task-overlay') closeSlideover(); });
  window.__fb.onAuthStateChanged(window.__fb.auth, onAuthChanged);
}
whenFirebaseReady(startApp);
</script>
</body>
</html>
